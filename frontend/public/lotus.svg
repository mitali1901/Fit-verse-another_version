      <stop offset="45%" stop-color="#A875D5" />
      <stop offset="100%" stop-color="#7B42B4" />
    </linearGradient>
    <linearGradient id="lotusInnerL" x1="38" y1="28" x2="58" y2="90" gradientUnits="userSpaceOnUse">
