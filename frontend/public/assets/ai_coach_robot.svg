<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Robot body/torso -->
  <rect x="30" y="55" width="60" height="45" rx="12" fill="#A875D5"/>
  <!-- Robot head -->
  <rect x="35" y="22" width="50" height="38" rx="10" fill="#C9A0DC"/>
  <!-- Antenna -->
  <rect x="58" y="10" width="4" height="14" rx="2" fill="#A875D5"/>
  <circle cx="60" cy="9" r="5" fill="#F2E8FA"/>
  <circle cx="60" cy="9" r="3" fill="#A875D5"/>
  <!-- Eyes -->
  <rect x="43" y="30" width="12" height="10" rx="4" fill="#F2E8FA"/>
  <rect x="65" y="30" width="12" height="10" rx="4" fill="#F2E8FA"/>
  <circle cx="49" cy="35" r="3" fill="#A875D5"/>
  <circle cx="71" cy="35" r="3" fill="#A875D5"/>
  <!-- Smile display -->
  <rect x="43" y="45" width="34" height="10" rx="5" fill="#F2E8FA" opacity="0.7"/>
  <path d="M48 50 Q60 56 72 50" stroke="#A875D5" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Ear/side panels -->
  <rect x="22" y="28" width="13" height="22" rx="6" fill="#B589CC"/>
  <rect x="85" y="28" width="13" height="22" rx="6" fill="#B589CC"/>
  <!-- Arms -->
  <rect x="12" y="58" width="18" height="32" rx="9" fill="#B589CC"/>
  <rect x="90" y="58" width="18" height="32" rx="9" fill="#B589CC"/>
  <!-- Hands -->
  <circle cx="21" cy="93" r="8" fill="#A875D5"/>
  <circle cx="99" cy="93" r="8" fill="#A875D5"/>
  <!-- Chest panel -->
  <rect x="42" y="62" width="36" height="28" rx="8" fill="#B589CC" opacity="0.6"/>
  <!-- Heart display on chest -->
  <path d="M60 85 L52 75 Q48 68 55 68 Q60 70 60 74 Q60 70 65 68 Q72 68 68 75 Z" fill="#EF4444" opacity="0.8"/>
  <!-- Legs -->
  <rect x="38" y="100" width="18" height="15" rx="7" fill="#9256C8"/>
  <rect x="64" y="100" width="18" height="15" rx="7" fill="#9256C8"/>
  <!-- Feet -->
  <rect x="34" y="112" width="22" height="8" rx="4" fill="#A875D5"/>
  <rect x="64" y="112" width="22" height="8" rx="4" fill="#A875D5"/>
</svg>

